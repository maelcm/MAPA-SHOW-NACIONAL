# =============================================================================
# STREAMLIT CLOUD — SECRETS (formato TOML)
# =============================================================================
# No painel do app: Settings → Secrets → cole o conteúdo abaixo
# substituindo pelos dados reais do seu credentials.json do Google.
# Não commite o arquivo com dados reais. Mudanças levam ~1 minuto para aplicar.
# =============================================================================

[gcp_service_account]
type = "service_account"
project_id = "SEU_PROJECT_ID"
private_key_id = "SEU_PRIVATE_KEY_ID"
private_key = """
-----BEGIN PRIVATE KEY-----
COLE_AQUI_A_CHAVE_PRIVADA_COMPLETA_DO_credentials.json
-----END PRIVATE KEY-----
"""
client_email = "sua-conta@seu-projeto.iam.gserviceaccount.com"
client_id = "SEU_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/..."
universe_domain = "googleapis.com"
